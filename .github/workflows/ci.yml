name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iam
          POSTGRES_PASSWORD: iam
          POSTGRES_DB: iam_test
        ports: ["5432/tcp"]
        options: >-
          --health-cmd "pg_isready -U iam -d iam_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379/tcp"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure isolated test environment
        run: |
          echo "DATABASE_URL_TEST=postgresql://iam:iam@localhost:${{ job.services.postgres.ports[5432] }}/iam_test?schema=public" >> "$GITHUB_ENV"
          echo "REDIS_URL_TEST=redis://localhost:${{ job.services.redis.ports[6379] }}/1" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://iam:iam@localhost:${{ job.services.postgres.ports[5432] }}/iam_test?schema=public" >> "$GITHUB_ENV"
          echo "ALLOW_DESTRUCTIVE_TEST_DATABASE=true" >> "$GITHUB_ENV"
          echo "REDIS_URL=redis://localhost:${{ job.services.redis.ports[6379] }}/1" >> "$GITHUB_ENV"
          echo "JWT_SECRET=ci-secret-at-least-32-characters-long" >> "$GITHUB_ENV"
          echo "JWT_ACCESS_TTL=15m" >> "$GITHUB_ENV"
          echo "JWT_REFRESH_TTL=7d" >> "$GITHUB_ENV"
          echo "CORS_ORIGIN=http://localhost:3000" >> "$GITHUB_ENV"
          echo "PORT=4000" >> "$GITHUB_ENV"
          echo "TRUST_PROXY_HOPS=0" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_API_URL=http://localhost:4000" >> "$GITHUB_ENV"
      - name: Generate Prisma client
        run: pnpm --filter @iam/api prisma:generate
      - name: Apply Prisma migrations (test DB)
        run: pnpm --filter @iam/api exec prisma migrate deploy --schema prisma/schema.prisma
      - name: Lint, typecheck, and run hermetic unit tests
        run: pnpm turbo run lint typecheck test:unit --force
      - name: Run integration tests against isolated services
        run: pnpm turbo run test:integration --filter=@iam/api --force
      - name: Build production outputs
        run: pnpm turbo run build --force
        env:
          NODE_ENV: production
      - name: Measure API coverage
        run: pnpm --filter @iam/api coverage
      - name: Measure shared coverage
        run: pnpm --filter @iam/shared coverage
      - name: Measure web coverage
        run: pnpm --filter @iam/web coverage
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  playwright:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iam
          POSTGRES_PASSWORD: iam
          POSTGRES_DB: iam_test
        ports: ["5432/tcp"]
        options: >-
          --health-cmd "pg_isready -U iam -d iam_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379/tcp"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure isolated test environment
        run: |
          echo "DATABASE_URL_TEST=postgresql://iam:iam@localhost:${{ job.services.postgres.ports[5432] }}/iam_test?schema=public" >> "$GITHUB_ENV"
          echo "REDIS_URL_TEST=redis://localhost:${{ job.services.redis.ports[6379] }}/1" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://iam:iam@localhost:${{ job.services.postgres.ports[5432] }}/iam_test?schema=public" >> "$GITHUB_ENV"
          echo "ALLOW_DESTRUCTIVE_TEST_DATABASE=true" >> "$GITHUB_ENV"
          echo "REDIS_URL=redis://localhost:${{ job.services.redis.ports[6379] }}/1" >> "$GITHUB_ENV"
          echo "JWT_SECRET=ci-secret-at-least-32-characters-long" >> "$GITHUB_ENV"
          echo "JWT_ACCESS_TTL=15m" >> "$GITHUB_ENV"
          echo "JWT_REFRESH_TTL=7d" >> "$GITHUB_ENV"
          echo "CORS_ORIGIN=http://localhost:3000" >> "$GITHUB_ENV"
          echo "PORT=4000" >> "$GITHUB_ENV"
          echo "TRUST_PROXY_HOPS=0" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_API_URL=http://localhost:4000" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BASE_URL=http://localhost:3000" >> "$GITHUB_ENV"
      - name: Generate Prisma client
        run: pnpm --filter @iam/api prisma:generate
      - name: Apply Prisma migrations (test DB)
        run: pnpm --filter @iam/api exec prisma migrate deploy --schema prisma/schema.prisma
      - name: Build shared, API, and production web outputs
        run: pnpm turbo run build --force
        env:
          NODE_ENV: production
      - name: Install Playwright browser
        run: pnpm --filter @iam/web exec playwright install --with-deps chromium
      - name: Run desktop and mobile Playwright projects
        run: pnpm --filter @iam/web exec playwright test --project=chromium --project=mobile
        env:
          CI: "true"
      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
      - name: Upload Playwright traces
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
